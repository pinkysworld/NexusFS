[node]
# A leading `~` is expanded. Keep this OUTSIDE any cloud-synced folder: a sync
# daemon rewriting files under the live embedded database can corrupt it.
data_dir = "~/.local/share/nexusfs"
device_name = "dev-node"

[net]
listen = "127.0.0.1:4444"
# Peer addresses to pull from, e.g. ["127.0.0.1:4445"].
peers = []
# Trust an unknown device the first time it connects and pin its key. Disable this
# and enrol peers explicitly if first contact could be intercepted.
tofu = true
sync_interval_secs = 15

[admin]
bind = "127.0.0.1:7070"
# token will be generated on first start if missing
token = ""

[s3]
enabled = false
bind = "127.0.0.1:9000"
# Required in the x-nexusfs-token header when set. Empty means no authentication,
# so leave the facade on loopback in that case.
token = ""

[posix]
enabled = false
mountpoint = "/mnt/nexus"

[security]
# Encrypt chunk content before it is written. The repository key is created in
# data_dir/repo.key on first use; back it up, because without it the content is
# unrecoverable. Replicas need the same key to read each other's files.
encrypt_at_rest = false
# none | transparent | required | zk_commit
#   transparent: attach signed evidence to local operations, reject malformed evidence
#   required:    as above, and refuse operations that carry no proof at all
#   zk_commit:   attach a Merkle inclusion path for the entry each operation is about,
#                so a receiver can check the claim against the root without holding the
#                author's prior state. Transparent proofs are still accepted, so a
#                cluster can be upgraded a node at a time.
#
# zk_commit is a commitment scheme, not zero-knowledge: a verifier learns the inode and
# its object hash, just not the rest of the tree. zk_full is accepted and behaves as
# none rather than pretending to prove anything.
proof_mode = "transparent"

[energy]
# Adapt replication to the device. Before each sync pass the daemon samples power
# source, charge, temperature, load and link cost, then decides what it may transfer.
#
# The grading keeps operations flowing and rations content, because an operation is a
# few hundred bytes and the content it names can be megabytes. A constrained device that
# still takes every operation knows what exists and where, and can fetch a specific file
# on demand — a much better degraded state than falling behind entirely.
#
#   on mains / power unknown  -> unlimited
#   battery above ~2x low     -> unlimited
#   battery in the band above -> content capped per pass
#   battery <= battery_low    -> operations only, content deferred
#   battery <= low/4          -> no sync at all
#   temp >= temp_high_c       -> operations only  (overrides battery)
#   metered link              -> operations only  (overrides battery)
#
# An unreadable sensor reports "unknown" and never constrains: a server with no battery
# is not a device at 0%. Set enabled = false to remove every limit while still reporting
# the reading at /api/energy.
enabled = true
battery_low_pct = 20
temp_high_c = 70
