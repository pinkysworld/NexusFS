name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The binary ships one executable whose surface is feature-gated, so the
      # non-default combinations have to build too or they rot unnoticed.
      - name: Build with optional features
        run: cargo build -p nexusfs --features "admin,quic,s3"

  # The playground runs the core in the browser, so a core change that breaks the
  # wasm target would silently break the site. Catch it here; the deploy workflow
  # builds the artefact it actually ships.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with wasm target
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown

      - name: Clippy (wasm target)
        run: cargo clippy -p nexusfs-wasm --target wasm32-unknown-unknown

      - name: Build wasm
        run: ./scripts/build_wasm.sh

      # The whole point of the JSON-over-buffers boundary is that the module needs no
      # JS glue. If something pulls in wasm-bindgen, imports appear and the page breaks
      # with a bare "LinkError" that is miserable to diagnose from a deployed site.
      - name: Assert the module has no JS imports
        run: |
          node -e '
            const {readFileSync} = require("fs");
            const m = new WebAssembly.Module(readFileSync("site/nexusfs.wasm"));
            const imports = WebAssembly.Module.imports(m);
            if (imports.length) {
              console.error("module gained JS imports:", imports);
              process.exit(1);
            }
            console.log("no imports — module is self-contained");
          '
