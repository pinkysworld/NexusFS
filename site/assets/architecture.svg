<svg width="960" height="640" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="80" x2="880" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2436"/>
      <stop offset="1" stop-color="#122F47"/>
    </linearGradient>
    <linearGradient id="accent" x1="220" y1="140" x2="760" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CE0C3"/>
      <stop offset="1" stop-color="#FFBC78"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="920" height="600" rx="34" fill="url(#bg)" stroke="#ADE8DD" stroke-opacity="0.22"/>

  <rect x="90" y="86" width="780" height="94" rx="24" fill="#143650" stroke="#2A596D"/>
  <text x="480" y="125" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#B9F7E1">Clients And Peers</text>
  <text x="480" y="151" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#CEE7E7">Admin UI, S3-like API, future POSIX mount, and remote replication endpoints</text>

  <rect x="140" y="220" width="300" height="120" rx="22" fill="#0F2940" stroke="#2B5262"/>
  <text x="290" y="263" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#F2FAF8">Protocol + Net</text>
  <text x="290" y="292" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#B6D0D5">Hello handshake</text>
  <text x="290" y="314" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#B6D0D5">Oplog-first sync</text>

  <rect x="520" y="220" width="300" height="120" rx="22" fill="#0F2940" stroke="#2B5262"/>
  <text x="670" y="263" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#F2FAF8">Crypto + Proofs</text>
  <text x="670" y="292" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#B6D0D5">Signatures and AEAD</text>
  <text x="670" y="314" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#B6D0D5">Transparent to ZK path</text>

  <rect x="140" y="392" width="680" height="140" rx="26" fill="#102231" stroke="url(#accent)" stroke-width="2"/>
  <text x="480" y="438" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="700" fill="#F4FBF9">Core State Machine</text>
  <text x="480" y="468" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#D1E8E5">Canonical object encoding, chunking, snapshots, CRDT merges, and idempotent oplog application</text>
  <text x="480" y="495" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#D1E8E5">Backed by a content-addressed blob store and a mutable KV layer</text>

  <path d="M480 180V215" stroke="#7CE0C3" stroke-width="3" stroke-linecap="round"/>
  <path d="M480 340V390" stroke="#FFBC78" stroke-width="3" stroke-linecap="round"/>
  <path d="M440 280H520" stroke="#5AC7A6" stroke-width="2" stroke-dasharray="8 8"/>

  <circle cx="480" cy="280" r="9" fill="#7CE0C3"/>
</svg>
