[workspace]
members = [
  "crates/nexusfs",
  "crates/core",
  "crates/storage",
  "crates/crypto",
  "crates/net",
  "crates/admin",
  "crates/s3",
  "crates/fs_posix",
  "crates/energy",
  "crates/privacy",
  "crates/zk",
  "crates/crdt",
  "crates/proto",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://example.invalid/nexusfs"
description = "NexusFS: single-executable verifiable distributed filesystem (blueprint skeleton)"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
quinn = "0.11"
rustls = "0.23"
rand = "0.8"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
chacha20poly1305 = { version = "0.10", features = ["std"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
time = { version = "0.3", features = ["formatting"] }
sled = "0.34"
rocksdb = { version = "0.22", default-features = false, features = ["snappy"] }
tempfile = "3"
rcgen = "0.13"
hex = "0.4"

